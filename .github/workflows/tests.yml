name: Tests

on:
  push:
  pull_request:

jobs:
  predicates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: Coupled libraries and inherited knowledge regression
        run: >-
          python -m unittest -q tests.test_action_predicates
          aspire.sim.tests.test_knowledge
          aspire.sim.tests.test_knowledge_cli
          aspire.sim.tests.test_preregistration
          aspire.sim.tests.test_knowledge_runtime
          aspire.sim.tests.test_record_skill_promotion
      - name: Evidence-grounded execution example
        run: python -m examples.predicate_loop --output /tmp/meta-robot-demo
