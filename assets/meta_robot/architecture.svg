<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">META-Robot: the full execution loop, supported by proprioception and predicates</title>
<desc id="desc">The full process evaluates preconditions, executes and observes, evaluates predicate state transitions, and repairs and validates. Proprioceptive evidence from torque, force and gripper feedback complements vision. Unknown evidence requests observation; failed checks lead to bounded repair and re-execution. Success requires satisfied terminal predicates and milestones supported by evidence. Validated experience is reviewed and consolidated into coupled predicate and skill libraries for reuse.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#142c3a"/></linearGradient>
<linearGradient id="flow"><stop stop-color="#63e5c9"/><stop offset="1" stop-color="#94c6ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6ae9ca" stop-opacity=".14"/><stop offset="1" stop-color="#6ae9ca" stop-opacity="0"/></radialGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#77e8cf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#99c6f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="590" rx="24" fill="url(#bg)"/>
<circle cx="1290" cy="339" r="137" fill="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="48" y="57" font-size="40" font-weight="700" fill="#f0f6fc">META-Robot</text>
<text x="48" y="88" font-size="19" fill="#acc3d6">Self Cognition and Capability Scaling in Agentic Robots</text>
<text x="1392" y="53" text-anchor="end" font-size="14" letter-spacing="2" fill="#74e8cf">PHYSICAL EVIDENCE &#8594; VERIFIED SUCCESS</text>

<!-- Physical observations ground the decisions made inside the execution loop. -->
<rect x="48" y="126" width="850" height="96" rx="19" fill="#15333d" stroke="#3b746b"/>
<path d="M74 180h17l7-12 9 27 12-39 12 24h22l8-12 9 26 11-14h23" fill="none" stroke="#70e8cf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="230" y="153" font-size="13" font-weight="700" letter-spacing="1.5" fill="#73e8cf">PROPRIOCEPTIVE EVIDENCE</text>
<text x="230" y="186" font-size="23" font-weight="700" fill="#e9faf5">Torque &#183; force &#183; gripper</text>
<path d="M642 146v55" stroke="#39606a"/>
<text x="674" y="153" font-size="13" letter-spacing="1.5" fill="#a7c8e7">+ VISION</text>
<text x="674" y="185" font-size="21" fill="#d1e2ed">Observations</text>
<path d="M163 226v61" fill="none" stroke="#71e8cb" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M442 226v61" fill="none" stroke="#71e8cb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="329" y="247" width="226" height="25" rx="12" fill="#102431"/>
<text x="442" y="264" text-anchor="middle" font-size="13" fill="#8fead5">Acquire action-aligned feedback</text>

<!-- Coupled libraries provide evaluation criteria and retain reviewed experience. -->
<rect x="1016" y="112" width="376" height="110" rx="19" fill="#101f2e" stroke="#365264"/>
<text x="1040" y="140" font-size="13" letter-spacing="1.5" fill="#bad1e1">COUPLED LIBRARIES</text>
<rect x="1040" y="156" width="143" height="44" rx="12" fill="#22473f"/>
<text x="1112" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#9df2d9">Predicates</text>
<text x="1206" y="184" text-anchor="middle" font-size="25" fill="#8db4cd">&#8596;</text>
<rect x="1228" y="156" width="140" height="44" rx="12" fill="#263d58"/>
<text x="1298" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#bbd9ff">Skills</text>
<path d="M1112 204v42H719v41" fill="none" stroke="#91bce8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#blue)"/>
<rect x="807" y="234" width="142" height="23" rx="11" fill="#102431"/>
<text x="878" y="250" text-anchor="middle" font-size="13" fill="#a6c9ec">Shared criteria</text>

<!-- Four stages remain explicit; repairs are conditional and task validation is required. -->
<g stroke-width="1.2">
<rect x="48" y="300" width="230" height="104" rx="18" fill="#172f3f" stroke="#4a887f"/>
<rect x="326" y="300" width="230" height="104" rx="18" fill="#172f3f" stroke="#3d6278"/>
<rect x="604" y="300" width="230" height="104" rx="18" fill="#193a41" stroke="#71cdb8"/>
<rect x="882" y="300" width="230" height="104" rx="18" fill="#1c3047" stroke="#42688d"/>
</g>
<g font-size="23" font-weight="700" fill="#eff6fc">
<text x="72" y="339">Evaluate before</text><text x="350" y="339" font-size="21">Execute &amp; observe</text><text x="628" y="339">Evaluate after</text><text x="906" y="339">Repair &amp; validate</text>
</g>
<g font-size="15" fill="#aec6d9">
<text x="72" y="369">Preconditions &#183; invariants</text><text x="350" y="369">Action + physical feedback</text><text x="628" y="369" fill="#99ead5">Predicate state transitions</text><text x="906" y="369">Local repair &#183; full-task check</text>
</g>
<g fill="none" stroke="url(#flow)" stroke-width="2.2" marker-end="url(#arrow)">
<path d="M288 351c10-8 16-8 26 0"/><path d="M566 351c10-8 16-8 26 0"/><path d="M844 351c10-8 16-8 26 0"/><path d="M1124 351c36 15 73 15 116-7"/>
</g>
<text x="1180" y="329" text-anchor="middle" font-size="12" fill="#9edac8">ALL CHECKS PASS</text>

<!-- Verified success is an evidence gate, followed by reviewed consolidation. -->
<circle cx="1290" cy="340" r="40" fill="#1a423c" stroke="#79ebcd" stroke-width="2"/>
<circle cx="1290" cy="340" r="51" fill="none" stroke="#6ae9ca" stroke-opacity=".3" stroke-dasharray="3 8"/>
<path d="m1273 339 12 13 24-27" fill="none" stroke="#98f5dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1290" y="418" text-anchor="middle" font-size="23" font-weight="700" fill="#a9f2db">Verified success</text>
<text x="1290" y="444" text-anchor="middle" font-size="13" fill="#a9c6cb">Terminal predicates + milestones</text>
<path d="M1290 282v-49" fill="none" stroke="#7edbc4" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1197" y="247" width="186" height="24" rx="12" fill="#102431"/>
<text x="1290" y="264" text-anchor="middle" font-size="13" fill="#a3dcca">Review &amp; consolidate</text>

<!-- Separate unknown-evidence and failure loops avoid equating missing evidence with success. -->
<path d="M719 412v27q0 16-16 16H458q-16 0-16-16v-27" fill="none" stroke="#8db6df" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#blue)"/>
<rect x="469" y="443" width="226" height="24" rx="12" fill="#102431"/>
<text x="582" y="460" text-anchor="middle" font-size="13" fill="#b3cee8">Unknown &#8594; acquire fresh evidence</text>
<path d="M997 412v70q0 24-24 24H187q-24 0-24-24v-70" fill="none" stroke="#69b5a7" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<rect x="365" y="494" width="430" height="25" rx="12" fill="#102431"/>
<text x="580" y="512" text-anchor="middle" font-size="14" fill="#a2d4c9">Failed checks &#8594; bounded repair &#8594; re-execute</text>
<path d="M48 537H1392" stroke="#2b4657"/>
<text x="48" y="565" font-size="15" fill="#b2cbdc"><tspan fill="#74e8cf" font-weight="700">SELF COGNITION</tspan> &#183; Evidence &#8594; judgment &#8594; diagnosis</text>
<text x="1392" y="565" text-anchor="end" font-size="15" fill="#b2cbdc"><tspan fill="#9cc7ff" font-weight="700">CAPABILITY SCALING</tspan> &#183; Reviewed skills + predicates</text>
</g></svg>
