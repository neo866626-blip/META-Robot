<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">META-Robot: success supported by physical evidence</title>
<desc id="desc">Torque, force and gripper feedback complement vision. Action predicates evaluate this evidence to verify contact, acquisition and the goal. Unknown or false conditions lead back to observation, repair and rechecking. Skills and predicates are retained together.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#122b36"/></linearGradient>
<linearGradient id="flow"><stop stop-color="#56dfc3"/><stop offset="1" stop-color="#8fbfff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#5de3c5" stop-opacity=".16"/><stop offset="1" stop-color="#5de3c5" stop-opacity="0"/></radialGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#71e7cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="return" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#b1c1ce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1280" height="390" rx="24" fill="url(#bg)"/>
